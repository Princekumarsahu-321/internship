apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-project
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-project
  template:
    metadata:
      labels:
        app: my-project
  spec: 
    containers:
        - name: my-project
          image: prxo/my-project:04
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"