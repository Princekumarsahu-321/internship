apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-project
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-project
  template:
    metadata:
      labels:
        app: my-project
  spec: 
    containers:
        - name: my-project
          image: prxo/my-project:04
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
              valueFrom: 
               configMapKeyRef:
                 name: homely-hub-config
                 key: PORT

---

apiVersion: v1
kind: Service
metadata:
  name: my-project-service
spec:
  selector:
    app: my-project
  type: NodePort
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000 
      nodePort: 30974